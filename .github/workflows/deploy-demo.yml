name: Deploy demo

# Step 16 (PRD): "demo live at a URL." Builds packages/demo as a static
# site and publishes it to GitHub Pages. Manual dispatch, not on every
# push to main — a demo redeploy is a visible, external action (a real
# person may be using the live URL right now), not something that should
# happen as a side effect of unrelated pushes; see docs/DEPLOY.md for
# the one-time repo setup this workflow depends on (Pages source, and
# the VITE_RELAY_URL variable pointing at a hosted packages/relay).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages (crdt/editor/provider/relay/sim dist/)
        run: npx tsc -b --pretty

      - name: Build demo
        working-directory: packages/demo
        env:
          GITHUB_PAGES: "true"
          VITE_RELAY_URL: ${{ vars.VITE_RELAY_URL }}
        run: pnpm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
