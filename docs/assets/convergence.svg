<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Two replicas type a word backward at the same time. RGA interleaves the two words. Fugue keeps each word whole.">
  <defs>
    <style>
      .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .eyeb { font-size: 12px; letter-spacing: 3px; fill: #f5c518; }
      .h1   { font-size: 26px; font-weight: 700; fill: #e4e6ea; }
      .sub  { font-size: 14px; fill: #7d838c; }
      .lbl  { font-size: 13px; letter-spacing: 2px; fill: #7d838c; }
      .name { font-size: 17px; font-weight: 700; fill: #e4e6ea; }
      .fill { font-size: 19px; font-weight: 700; fill: #0b0c0e; text-anchor: middle; }
      .holl { font-size: 19px; font-weight: 700; fill: #e4e6ea; text-anchor: middle; }
      .verd { font-size: 16px; font-weight: 700; }
      .note { font-size: 13px; fill: #7d838c; }
    </style>
  </defs>

  <rect width="1200" height="500" rx="16" fill="#0b0c0e"/>
  <rect x="0.5" y="0.5" width="1199" height="499" rx="16" fill="none" stroke="#262a30"/>

  <text class="mono eyeb" x="72" y="54">S5 · THE ONE TEST THAT DECIDED THE ALGORITHM</text>
  <text class="mono h1" x="72" y="90">Converging is easy. Staying readable is not.</text>
  <text class="mono sub" x="72" y="116">Filled cells were typed by A. Outlined cells were typed by B.</text>

  <!-- setup -->
  <text class="mono lbl" x="72" y="170">A TYPES "hello" BACKWARD</text>
  <g>
    <rect x="400" y="148" width="32" height="34" rx="4" fill="#f5c518"/><text class="mono fill" x="416" y="172">o</text>
    <rect x="436" y="148" width="32" height="34" rx="4" fill="#f5c518"/><text class="mono fill" x="452" y="172">l</text>
    <rect x="472" y="148" width="32" height="34" rx="4" fill="#f5c518"/><text class="mono fill" x="488" y="172">l</text>
    <rect x="508" y="148" width="32" height="34" rx="4" fill="#f5c518"/><text class="mono fill" x="524" y="172">e</text>
    <rect x="544" y="148" width="32" height="34" rx="4" fill="#f5c518"/><text class="mono fill" x="560" y="172">h</text>
  </g>
  <text class="mono note" x="608" y="170">on its own, A reads "olleh"</text>

  <text class="mono lbl" x="72" y="224">B TYPES "world" BACKWARD</text>
  <g>
    <rect x="400" y="202" width="32" height="34" rx="4" fill="none" stroke="#454c55"/><text class="mono holl" x="416" y="226">d</text>
    <rect x="436" y="202" width="32" height="34" rx="4" fill="none" stroke="#454c55"/><text class="mono holl" x="452" y="226">l</text>
    <rect x="472" y="202" width="32" height="34" rx="4" fill="none" stroke="#454c55"/><text class="mono holl" x="488" y="226">r</text>
    <rect x="508" y="202" width="32" height="34" rx="4" fill="none" stroke="#454c55"/><text class="mono holl" x="524" y="226">o</text>
    <rect x="544" y="202" width="32" height="34" rx="4" fill="none" stroke="#454c55"/><text class="mono holl" x="560" y="226">w</text>
  </g>
  <text class="mono note" x="608" y="224">on its own, B reads "dlrow"</text>

  <!-- divider -->
  <line x1="72" y1="278" x2="392" y2="278" stroke="#262a30"/>
  <text class="mono lbl" x="600" y="283" text-anchor="middle">THE SAME 10 OPS, IN ANY ORDER</text>
  <line x1="808" y1="278" x2="1128" y2="278" stroke="#262a30"/>

  <!-- result: RGA -->
  <text class="mono name" x="72" y="345">RgaDoc</text>
  <text class="mono lbl" x="72" y="366">RGA</text>
  <g>
    <rect x="240" y="326" width="32" height="34" rx="4" fill="none" stroke="#454c55"/><text class="mono holl" x="256" y="350">d</text>
    <rect x="276" y="326" width="32" height="34" rx="4" fill="#f5c518"/><text class="mono fill" x="292" y="350">o</text>
    <rect x="312" y="326" width="32" height="34" rx="4" fill="none" stroke="#454c55"/><text class="mono holl" x="328" y="350">l</text>
    <rect x="348" y="326" width="32" height="34" rx="4" fill="#f5c518"/><text class="mono fill" x="364" y="350">l</text>
    <rect x="384" y="326" width="32" height="34" rx="4" fill="none" stroke="#454c55"/><text class="mono holl" x="400" y="350">r</text>
    <rect x="420" y="326" width="32" height="34" rx="4" fill="#f5c518"/><text class="mono fill" x="436" y="350">l</text>
    <rect x="456" y="326" width="32" height="34" rx="4" fill="none" stroke="#454c55"/><text class="mono holl" x="472" y="350">o</text>
    <rect x="492" y="326" width="32" height="34" rx="4" fill="#f5c518"/><text class="mono fill" x="508" y="350">e</text>
    <rect x="528" y="326" width="32" height="34" rx="4" fill="none" stroke="#454c55"/><text class="mono holl" x="544" y="350">w</text>
    <rect x="564" y="326" width="32" height="34" rx="4" fill="#f5c518"/><text class="mono fill" x="580" y="350">h</text>
  </g>
  <text class="mono verd" x="648" y="345" style="fill:#7d838c">Interleaved</text>
  <text class="mono note" x="648" y="366">every replica agrees, on a jumble</text>

  <!-- result: Fugue -->
  <text class="mono name" x="72" y="425">Doc</text>
  <text class="mono lbl" x="72" y="446">FUGUE · SHIPS</text>
  <g>
    <rect x="240" y="406" width="32" height="34" rx="4" fill="#f5c518"/><text class="mono fill" x="256" y="430">o</text>
    <rect x="276" y="406" width="32" height="34" rx="4" fill="#f5c518"/><text class="mono fill" x="292" y="430">l</text>
    <rect x="312" y="406" width="32" height="34" rx="4" fill="#f5c518"/><text class="mono fill" x="328" y="430">l</text>
    <rect x="348" y="406" width="32" height="34" rx="4" fill="#f5c518"/><text class="mono fill" x="364" y="430">e</text>
    <rect x="384" y="406" width="32" height="34" rx="4" fill="#f5c518"/><text class="mono fill" x="400" y="430">h</text>
    <rect x="420" y="406" width="32" height="34" rx="4" fill="none" stroke="#454c55"/><text class="mono holl" x="436" y="430">d</text>
    <rect x="456" y="406" width="32" height="34" rx="4" fill="none" stroke="#454c55"/><text class="mono holl" x="472" y="430">l</text>
    <rect x="492" y="406" width="32" height="34" rx="4" fill="none" stroke="#454c55"/><text class="mono holl" x="508" y="430">r</text>
    <rect x="528" y="406" width="32" height="34" rx="4" fill="none" stroke="#454c55"/><text class="mono holl" x="544" y="430">o</text>
    <rect x="564" y="406" width="32" height="34" rx="4" fill="none" stroke="#454c55"/><text class="mono holl" x="580" y="430">w</text>
  </g>
  <text class="mono verd" x="648" y="425" style="fill:#f5c518">Contiguous</text>
  <text class="mono note" x="648" y="446">each writer's word stays whole</text>

  <text class="mono note" x="72" y="480" style="fill:#5f656d">The jumble is pinned as an assertion on purpose. Fixing it in that file would delete the exhibit.</text>
</svg>
